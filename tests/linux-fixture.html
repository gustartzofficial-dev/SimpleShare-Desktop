<!doctype html><html><body><input id="myName"><div id="people"></div><button id="shareBtn">Share</button><button id="stopBtn" hidden>Stop</button><canvas id="picture" width="320" height="180"></canvas><script>
(async()=>{
 const report=value=>fetch('/probe',{method:'POST',body:JSON.stringify(value)});
 try{
  const capabilities={rtc:typeof RTCPeerConnection,audio:typeof AudioContext,encoder:typeof VideoEncoder,display:typeof navigator.mediaDevices?.getDisplayMedia,native:typeof window.__simpleShareNative};await report(capabilities);
  if(capabilities.rtc!=='function'||capabilities.audio!=='function'||capabilities.encoder!=='function')throw Error('Required Linux media APIs are unavailable: '+JSON.stringify(capabilities));
  const a=new RTCPeerConnection({iceServers:[]});let received=false;const channel=a.createDataChannel('qa');channel.onmessage=e=>received=e.data==='SimpleShare Linux';channel.onopen=()=>channel.send('SimpleShare Linux');
  const canvas=document.getElementById('picture'),paint=canvas.getContext('2d');let n=0;const timer=setInterval(()=>{paint.fillStyle=n++%2?'#f29a78':'#172015';paint.fillRect(0,0,320,180);},100);const stream=canvas.captureStream(10);stream.getVideoTracks()[0].contentHint='detail';a.addTrack(stream.getVideoTracks()[0],stream);
  const video=document.createElement('video');video.autoplay=true;video.muted=true;document.body.append(video);a.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play().catch(()=>{});};
  await report({...capabilities,step:'createOffer'});await a.setLocalDescription(await a.createOffer());await report({...capabilities,step:'gather'});const gather=Date.now()+7000;while(a.iceGatheringState!=='complete'&&Date.now()<gather)await new Promise(r=>setTimeout(r,50));
  await report({...capabilities,step:'answer'});const response=await fetch('/offer',{method:'POST',body:JSON.stringify(a.localDescription)});const answer=await response.json();if(!response.ok)throw Error(JSON.stringify(answer));await a.setRemoteDescription(answer);await report({...capabilities,step:'media'});
  const deadline=Date.now()+25000;let decoded=0;while(Date.now()<deadline&&(!received||!decoded)){decoded=[...(await a.getStats()).values()].find(s=>s.type==='inbound-rtp'&&s.kind==='video')?.framesDecoded||0;await new Promise(r=>setTimeout(r,100));}
  if(!received||!decoded)throw Error('Linux/browser media interop failed: '+JSON.stringify({received,decoded,state:a.connectionState}));
  await report({...capabilities,dataChannel:true,videoFrames:decoded});history.replaceState(null,'','?room=abcdef1234567890abcdef12');document.body.dataset.room='connected';window.__simpleShareNative.savePreference('simpleshare-name','Linux native smoke');
  window.qaConnection=a;window.qaStream=stream;window.qaTimer=timer; // Keep both directions alive until the host verifies browser decoding.
 }catch(error){await report({error:String(error),stack:error.stack});}
})();
</script></body></html>
