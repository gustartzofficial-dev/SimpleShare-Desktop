<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/style.css"><script type="module" src="/src/capture.js"></script><title>Share something good</title></head><body><main class="capture-page"><header><p class="eyebrow">GO LIVE</p><h1>Share something good.</h1><p>Choose a window or display. Your room stays right where you left it.</p></header><div class="capture-toolbar"><div role="tablist" aria-label="Capture sources"><button id="windowsTab" role="tab" aria-selected="true">Windows</button><button id="displaysTab" role="tab" aria-selected="false">Displays</button></div><input id="sourceSearch" type="search" placeholder="Find a window…" aria-label="Find a capture source"></div><div id="captureSources" class="capture-sources" role="group" aria-label="Available capture sources"></div><section id="captureAudio"><label for="captureAudioSource">Application sound</label><select id="captureAudioSource"><option value="">No sound</option></select><p>Only the chosen application's sound is included. Browser applications may include their other tabs.</p></section><p id="captureError" role="alert"></p><footer><button id="captureCancel" class="secondary">Cancel</button><button id="captureConfirm" class="primary" disabled>Share window</button></footer></main></body></html>
