<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/style.css"><script type="module" src="/src/capture.js"></script><title data-i18n="title.capture">Share something good</title></head><body><main class="capture-page"><header><p class="eyebrow" data-i18n="capture.kicker">GO LIVE</p><h1 data-i18n="capture.title">Share something good.</h1><p data-i18n="capture.lede">Choose a window or display. Your room stays right where you left it.</p></header><div class="capture-toolbar"><div role="tablist" aria-label="Capture sources" data-i18n-attr="aria-label=capture.sources"><button id="windowsTab" role="tab" aria-selected="true" data-i18n="capture.windows">Windows</button><button id="displaysTab" role="tab" aria-selected="false" data-i18n="capture.displays">Displays</button></div><button id="refreshPreviews" class="icon-button" aria-label="Refresh source previews" title="Refresh previews" data-i18n-attr="aria-label=capture.refresh;title=capture.refreshTitle">↻</button><input id="sourceSearch" type="search" placeholder="Find a window…" aria-label="Find a capture source" data-i18n-attr="aria-label=capture.find"></div><div id="captureSources" class="capture-sources" role="group" aria-label="Available capture sources" data-i18n-attr="aria-label=capture.available"></div><section id="captureAudio"><label for="captureAudioSource" data-i18n="capture.sound">Application sound</label><select id="captureAudioSource"><option value="" data-i18n="capture.noSound">No sound</option></select><p data-i18n="capture.soundHelp">Only the chosen application's sound is included. Browser applications may include their other tabs.</p></section><p id="captureError" role="alert"></p><footer><button id="captureCancel" class="secondary" data-i18n="capture.cancel">Cancel</button><button id="captureConfirm" class="primary" disabled data-i18n="capture.shareWindow">Share window</button></footer></main></body></html>
